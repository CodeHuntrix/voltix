[project]
name = "voltix-worker"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "arq>=0.26.0",
  "redis>=5.2.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "pydantic-settings>=2.6.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
